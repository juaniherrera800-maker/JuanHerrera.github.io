<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="estilos.css" />
    <title>Links</title>
  </head>
  <body>
    <main class="contenedor">
      <section class="bio">
        <img
          src="../img/fotojuan.jpeg"
          alt=" Foto de Juan Herrera"
          class="foto"
        />
        <h1 class="nombre">Juan Herrera</h1>
        <p class="descripcion">Jugador de Futbol Profesional</p>
      </section>
      <nav class="links">
        <a
          href="https://www.desarrolloweb.io"
          class="link sitio-web"
          target="_blank"
          >Sitio Web</a
        >
        <a
          href="https://www.youtube.com/falconmasters"
          class="link youtube"
          target="_blank"
          >Youtube</a
        >
        <a href="https://www.x.com/falconmasters" class="link x" target="_blank"
          >X</a
        >
        <a
          href="https://www.facebook.com/falconmasters"
          class="link facebook"
          target="_blank"
          >Facebook</a
        >
        <a
          href="https://www.instagram.com/"
          class="link instagram"
          target="_blank"
          >Instagram</a
        >
      </nav>
    </main>
  </body>
</html>
